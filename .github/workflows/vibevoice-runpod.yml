name: Build and Push VibeVoice RunPod Worker

on:
  push:
    branches: [master, main]
    paths:
      - "VibeVoiceRunpod/**"
      - ".github/workflows/vibevoice-runpod.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hthuku95/vibevoice-runpod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            latest
            ${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./VibeVoiceRunpod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed ${IMAGE}:${{ github.sha }} → $(curl -s -o /dev/null -w '%{http_code}' https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/latest || true)"
